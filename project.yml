name: Stash
options:
  bundleIdPrefix: com.altmihai31
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  StashKit:
    path: Packages/StashKit
targets:
  Stash:
    type: application
    platform: iOS
    sources:
      - Stash/Sources
      - Stash/Resources
      - Shared
    dependencies:
      - package: StashKit
      - target: StashShare
    entitlements:
      path: Stash/Stash.entitlements
      properties:
        com.apple.security.application-groups: [group.com.altmihai31.stash]
    info:
      path: Stash/Info.plist
      properties:
        CFBundleDisplayName: Stash
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        StashAppGroup: group.com.altmihai31.stash
        CFBundleURLTypes:
          - CFBundleURLName: com.altmihai31.stash
            CFBundleURLSchemes: [stash]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altmihai31.stash
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  StashShare:
    type: app-extension
    platform: iOS
    sources:
      - StashShare
      - Shared
    dependencies:
      - package: StashKit
    entitlements:
      path: StashShare/StashShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.altmihai31.stash]
    info:
      path: StashShare/Info.plist
      properties:
        CFBundleDisplayName: Stash
        StashAppGroup: group.com.altmihai31.stash
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altmihai31.stash.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
  StashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StashUITests
    dependencies:
      - target: Stash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altmihai31.stash.uitests
        TEST_TARGET_NAME: Stash
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Stash:
    build:
      targets:
        Stash: all
        StashUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - StashUITests
